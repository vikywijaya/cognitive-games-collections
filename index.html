<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindFit – Cognitive Games for Seniors</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== APP HEADER ===== -->
  <header class="app-header">
    <div class="header-inner">
      <button class="btn-icon" id="btnBack" style="visibility:hidden" aria-label="Go back">
        &#8592; Back
      </button>
      <span class="app-logo" id="appLogo">🧠 MindFit</span>
      <button class="btn-icon" id="btnHome" style="visibility:hidden" aria-label="Go home">
        🏠 Home
      </button>
    </div>
  </header>

  <!-- ===== MAIN VIEW ===== -->
  <main class="app-main" id="appMain">
    <!-- Views injected here by JavaScript -->
  </main>

  <footer class="app-footer">
    <p>MindFit &mdash; Keep Your Mind Sharp Every Day</p>
  </footer>

  <!-- ===== GAME REGISTRY ===== -->
  <script src="js/config.js"></script>

  <!-- Memory Category -->
  <script src="js/games/memory-match.js"></script>
  <script src="js/games/sequence-recall.js"></script>

  <script src="js/games/color-match.js"></script>
  <script src="js/games/number-hunt.js"></script>

  <!-- Language Category -->
  <script src="js/games/anagram.js"></script>
  <script src="js/games/word-search.js"></script>

  <!-- Speed Category -->
  <script src="js/games/quick-math.js"></script>
  <script src="js/games/reaction-time.js"></script>

  <!-- Problem Solving Category -->
  <script src="js/games/number-sequence.js"></script>
  <script src="js/games/pattern-match.js"></script>

  <!-- ===== MAIN APP ===== -->
  <script src="js/app.js"></script>
